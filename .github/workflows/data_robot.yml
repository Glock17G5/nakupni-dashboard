name: Data Robot
on:
  schedule:
    # 05:10 UTC = 07:10 Praha v létě — CCMN Changjiang už od ~4:30 (10:30 Čína)
    # 13:00 UTC = 15:00 Praha v létě / 14:00 v zimě — LME Official 13:20–14:25 Praha
    - cron: "10 5,13 * * 1-5"
  workflow_dispatch:
jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: pip install requests beautifulsoup4 lxml yfinance pandas
      - name: Fetch market data
        id: robot
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_SMTP_HOST: ${{ secrets.ALERT_SMTP_HOST }}
          ALERT_SMTP_PORT: ${{ secrets.ALERT_SMTP_PORT }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python data_robot.py
      - run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add robot_data.json robot_history.csv ccmn_history.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatická aktualizace tržních dat" && git push)
      - name: Alert — source missing
        if: steps.robot.outcome == 'failure'
        run: |
          echo "Datový robot nahlásil výpadek zdroje (CCMN / Yahoo)."
          echo "Dashboard v appce ukáže červený alert. Zkontroluj log tohoto jobu."
          exit 1
