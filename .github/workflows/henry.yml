name: Henry Telegram

on:
  schedule:
    # Job běží ~6 h (long poll). Každých 5 h se restartuje, mezera je jen pip.
    - cron: "0 */5 * * *"
  workflow_dispatch:

concurrency:
  group: henry-telegram
  cancel-in-progress: true

jobs:
  henry:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-henry.txt
      - name: Restore Telegram offset
        uses: actions/cache/restore@v5
        with:
          path: |
            .henry_tg_offset
            .henry_daily_sent
            .henry_midday_sent
            .henry_lme_sent
            .henry_morning_urls
            .henry_voice
            .henry_kb_inline
          key: henry-tg-${{ github.run_id }}
          restore-keys: |
            henry-tg-
      - run: pip install -r requirements-henry.txt
      - name: Run Henry
        timeout-minutes: 355
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HENRY_LISTEN_SEC: "20700"
        run: python henry.py --listen
      - name: Save Telegram offset
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            .henry_tg_offset
            .henry_daily_sent
            .henry_midday_sent
            .henry_lme_sent
            .henry_morning_urls
            .henry_voice
            .henry_kb_inline
          key: henry-tg-${{ github.run_id }}
